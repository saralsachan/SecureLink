<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureLink</title>
  </head>
  <body>
    <main id="app">
      <h1>SecureLink</h1>
      <button id="activate-agent" type="button">Activate Agent</button>
      <button id="vision-self-test" type="button">Run vision self-test</button>
      <p id="status" role="status">Ready to connect.</p>
      <button id="redaction-debug" type="button">Run redaction debug</button>
      <section id="redact-debug" hidden>
        <div id="redact-panels">
          <div class="redact-panel">
            <h2>Raw</h2>
            <canvas id="redact-raw" width="640" height="360"></canvas>
          </div>
          <div class="redact-panel">
            <h2>Redacted</h2>
            <canvas id="redact-redacted" width="640" height="360"></canvas>
          </div>
        </div>
        <div id="redact-key-section">
          <h3>Redaction key (<span id="redact-key-count">0</span> entries)</h3>
          <ul id="redact-key-list"></ul>
        </div>
      </section>
      <details id="perf-panel" class="perf-panel">
        <summary>Pipeline latency</summary>
        <div id="perf-meta" class="perf-meta">Waiting for the first agent step…</div>
        <table class="perf-table">
          <thead>
            <tr>
              <th>Stage</th>
              <th class="num">ms</th>
              <th class="num">share</th>
              <th class="bar-col"></th>
            </tr>
          </thead>
          <tbody id="perf-table-body"></tbody>
          <tfoot>
            <tr>
              <th>Total</th>
              <th id="perf-total" class="num"></th>
              <th colspan="2"></th>
            </tr>
          </tfoot>
        </table>
      </details>
      <img id="capture-preview" alt="Captured tab preview" hidden />
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
